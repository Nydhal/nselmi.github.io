<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cellular automaton constructions</title>
<style>
[hidden]{display:none!important}:root{color-scheme:dark;font:15px/1.5 system-ui;background:#11161b;color:#e5edf0}*{box-sizing:border-box}body{margin:0}header{padding:28px 4vw;border-bottom:1px solid #334149}h1{font-size:30px;margin:0 0 8px}p{max-width:85ch;color:#b9c9d0}a{color:#8dd7c3}button,input,select{font:inherit;background:#202c33;color:inherit;border:1px solid #536772;border-radius:5px;padding:8px}button,a,input,select{accent-color:#7ac7b0}button{cursor:pointer}button.active{border-color:#8de0c5;background:#31443e}nav{display:flex;gap:10px;flex-wrap:wrap}main{padding:24px 4vw}.workspace{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px}#entries{display:flex;flex-direction:column;gap:8px;max-height:80vh;overflow:auto}#entries button{text-align:left}small{display:block;color:#aac0c8}.panel{background:#182127;border:1px solid #334149;padding:20px;border-radius:8px}h2{margin-top:0}canvas{display:block;max-width:100%;height:auto;margin:auto}#drawing{max-height:65vh;overflow:auto;background:#fff}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:16px 0}.controls label{display:flex;align-items:center;gap:5px}#rows{width:95px}#notice{color:#ffc88a}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 monospace;color:#b4c7ce}#seed{max-height:90px;overflow:auto}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.cards img{width:100%;height:210px;object-fit:contain;background:#eee}.cards article{min-width:0}.cards p{overflow-wrap:anywhere;font-size:13px}.tag{font-size:12px;color:#9ad9c7}#reference img{max-width:100%;max-height:65vh;background:white}details{margin-top:16px}summary{cursor:pointer}#source{font-size:12px;overflow-wrap:anywhere}.sr{position:absolute;left:-10000px}@media(max-width:800px){.workspace{grid-template-columns:1fr}#entries{max-height:240px}main{padding:16px}.panel{padding:12px}}

<header><a href="../impossible-fractal-ca.html">← Cellular automaton explorer</a><h1>Constructions</h1></header>
<main><section class="workspace"><aside><label for="search">Find a construction</label><input id="search" placeholder="Name or rule count" style="width:100%;margin:10px 0"><div id="entries"></div></aside>
<article class="panel"><h2 id="name"></h2><a id="openExplorer">Open in explorer</a><p id="facts"></p>
<div class="controls"><label>Rows <input id="rows" type="number" min="1" max="512"></label><label>Phase <select id="phase"><option value="0">0</option><option value="1">1</option></select></label><label>Palette <select id="palette"></select></label><button id="replay">Generate</button><button id="export">Export world</button><a id="download" download>Original world</a></div>
